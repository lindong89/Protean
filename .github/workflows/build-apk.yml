name: Build Apks

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.idea/**'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本号由 git 提交数与短哈希生成，浅克隆会让版本号与本地不一致
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APKs (app / arm64 / x64)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --parallel --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testArm64DebugUnitTest --stacktrace

      - name: Show APK SHA256
        run: |
          {
            echo "### Build Success :rocket:"
            echo ""
            echo "| APK | SHA256 |"
            echo "| :-- | :-- |"
            for f in app/build/outputs/apk/*/debug/*.apk; do
              echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Protean-debug-${{ github.sha }}
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
