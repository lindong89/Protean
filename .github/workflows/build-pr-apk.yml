name: Pull Request Check

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本号由 git 提交数与短哈希生成，浅克隆会让版本号与本地不一致
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APKs (app / arm64 / x64)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --parallel --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testArm64DebugUnitTest --stacktrace
